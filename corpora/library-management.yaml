format: goldenrec-scenario/v1
name: library management routes with stock parity
base_url_env: JELLYFIN_BASE_URL
steps:
  # ------------------------------------------------------------------
  # Phase 0: empty baseline. GET must return 200 with an empty array.
  # ------------------------------------------------------------------
  - name: list virtual folders (empty)
    method: GET
    path: /Library/VirtualFolders
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 200
    normalizers:
      - library-folder-ids
      - library-options-defaults
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-length-header
      - content-language-header
      - vary-header
    operation_id: GetVirtualFolders

  # ------------------------------------------------------------------
  # Phase 1: all six management routes exercised through a Paths probe.
  # POST/DELETE /Library/VirtualFolders/Paths use /tmp, a directory that
  # exists on both the stock container and the native Deadfin host, so the
  # same path string is accepted by both servers and read back identically
  # in Locations. The path is host-agnostic and portable. Single-folder
  # readbacks avoid host-local directory-enumeration order differences.
  # ------------------------------------------------------------------
  - name: add paths probe library
    method: POST
    path: /Library/VirtualFolders
    params:
      name: PathsProbe
      collectionType: movies
    headers:
      Accept: application/json
      Content-Type: application/json
    body: {}
    auth_role: admin
    expect:
      status: 204
    normalizers: &write
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-length-header
      - content-language-header
      - vary-header
    operation_id: AddVirtualFolder
  - name: add media path (POST VirtualFolders/Paths)
    method: POST
    path: /Library/VirtualFolders/Paths
    headers:
      Accept: application/json
      Content-Type: application/json
    body:
      Name: PathsProbe
      Path: /tmp
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: AddMediaPath
  - name: list virtual folders (after add path)
    method: GET
    path: /Library/VirtualFolders
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 200
    normalizers: &read
      - library-folder-ids
      - library-options-defaults
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-length-header
      - content-language-header
      - vary-header
    operation_id: GetVirtualFolders
  - name: remove media path (DELETE VirtualFolders/Paths)
    method: DELETE
    path: /Library/VirtualFolders/Paths
    params:
      name: PathsProbe
      path: /tmp
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: RemoveMediaPath
  - name: list virtual folders (after remove path)
    method: GET
    path: /Library/VirtualFolders
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 200
    normalizers: *read
    operation_id: GetVirtualFolders
  - name: remove paths probe library
    method: DELETE
    path: /Library/VirtualFolders
    params:
      name: PathsProbe
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: RemoveVirtualFolder

  # ------------------------------------------------------------------
  # Phase 2: collectionType probes. Omitted, empty, and invalid (photos)
  # each create the folder with no CollectionType (null) and no .collection
  # marker; readback omits CollectionType. Each of the eight valid values
  # creates its matching marker; readback reports the canonical lowercase
  # CollectionType. Each probe is a create/readback/delete cycle so the
  # readback holds exactly one folder, avoiding host-local enumeration
  # order differences (stock enumerates the directory in filesystem order;
  # Deadfin sorts).
  # ------------------------------------------------------------------
  - name: add library with omitted collectionType
    method: POST
    path: /Library/VirtualFolders
    params:
      name: CTProbe
    headers:
      Accept: application/json
      Content-Type: application/json
    body: {}
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: AddVirtualFolder
  - name: readback omitted collectionType (no marker)
    method: GET
    path: /Library/VirtualFolders
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 200
    normalizers: *read
    operation_id: GetVirtualFolders
  - name: cleanup omitted collectionType library
    method: DELETE
    path: /Library/VirtualFolders
    params:
      name: CTProbe
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: RemoveVirtualFolder
  - name: add library with empty collectionType
    method: POST
    path: /Library/VirtualFolders
    params:
      name: CTProbe
      collectionType: ""
    headers:
      Accept: application/json
      Content-Type: application/json
    body: {}
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: AddVirtualFolder
  - name: readback empty collectionType (no marker)
    method: GET
    path: /Library/VirtualFolders
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 200
    normalizers: *read
    operation_id: GetVirtualFolders
  - name: cleanup empty collectionType library
    method: DELETE
    path: /Library/VirtualFolders
    params:
      name: CTProbe
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: RemoveVirtualFolder
  - name: add library with invalid collectionType
    method: POST
    path: /Library/VirtualFolders
    params:
      name: CTProbe
      collectionType: photos
    headers:
      Accept: application/json
      Content-Type: application/json
