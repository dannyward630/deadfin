  # ------------------------------------------------------------------
  # Phase 2c: alternate collectionType spellings from the source matrix
  # at deadfin/deadfin@baa149a9e3526e65d3f8b5102066d62f92fb7c2b:internal/
  # api/handlers/library_management_test.go:273-329. Accepted inputs
  # produce the canonical lowercase name. The rejected input 1.0
  # produces null on both hosts (HTTP 204, no CollectionType, no
  # .collection marker). Stock and Deadfin agree on 1.0. Stock accepts
  # 8, -1, and 0,1 but Deadfin rejects them (no CollectionType). Those
  # three spellings are divergences, not replay cycles (see
  # docs/divergences.md D-26). Each cycle is a tight same-folder
  # create/readback/delete triple. Accepted spellings use the *read
  # anchor (masks host-local ItemId and LibraryOptions defaults, leaves
  # CollectionType visible). Rejected spellings use the same anchor.
  # No normalizer is added.
  # ------------------------------------------------------------------
  - name: add library collectionType alternate Movies (movies)
    method: POST
    path: /Library/VirtualFolders
    params:
      name: CTProbe
      collectionType: Movies
    headers:
      Accept: application/json
      Content-Type: application/json
