  # so the ASP.NET model binder accepts the same ordinals. Each numeric
  # value is quoted in YAML so the loader preserves the exact spelling
  # (01, +5) through fmt.Sprint before the request runs. Each cycle is a
  # tight same-folder create/readback/delete triple. The readback
  # normalizer set is the same *read anchor: it masks host-local ItemId
  # and LibraryOptions defaults but leaves CollectionType visible so the
  # differential comparison detects an incorrect canonical value. No
  # normalizer is added for numeric spellings.
