  # ------------------------------------------------------------------
  # Phase 3: virtual-folder identity, ItemId capture, LibraryOptions
  # update, and persisted-options readback. The GET captures the scanned
  # CollectionFolder ItemId from the raw response; POST LibraryOptions
  # addresses the library by that ItemId and persists changed options;
  # the readback confirms the persisted options. Default-options GET
  # readbacks (empty, after-path, collectionType, identity) mask host-local
  # LibraryOptions defaults via library-options-defaults (replacing the
  # whole object). The persisted-options readback selects library-options-
  # persisted instead: it masks host-local default fields within
  # LibraryOptions while preserving EnableInternetProviders and
  # SaveLocalMetadata, so the changed values remain visible in the
  # normalized comparison and a host that does not persist them is caught.
  # The host-local ItemId is masked by library-folder-ids on both readback
  # kinds. Capturing the persisted values from the raw response documents
  # persistence; the normalized comparison now also verifies it.
  # ------------------------------------------------------------------
  - name: add options probe library
    method: POST
    path: /Library/VirtualFolders
    params:
      name: OptionsProbe
      collectionType: movies
    headers:
      Accept: application/json
      Content-Type: application/json
    body: {}
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: AddVirtualFolder
  - name: capture folder ItemId (identity readback)
    method: GET
    path: /Library/VirtualFolders
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 200
    capture:
      folder_item_id: 0.ItemId
    normalizers: *read
    operation_id: GetVirtualFolders
  - name: update library options (POST LibraryOptions with captured ItemId)
    method: POST
    path: /Library/VirtualFolders/LibraryOptions
    headers:
      Accept: application/json
      Content-Type: application/json
    body:
      Id: ${folder_item_id}
      LibraryOptions:
        EnableInternetProviders: true
        SaveLocalMetadata: true
        PathInfos: []
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: UpdateLibraryOptions
  - name: persisted-options readback (unnormalized LibraryOptions capture)
    method: GET
    path: /Library/VirtualFolders
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 200
    capture:
      persisted_enable_internet_providers: 0.LibraryOptions.EnableInternetProviders
      persisted_save_local_metadata: 0.LibraryOptions.SaveLocalMetadata
    normalizers: &read_persisted
      - library-folder-ids
      - library-options-persisted
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-length-header
      - content-language-header
      - vary-header
    operation_id: GetVirtualFolders
  - name: cleanup options probe library
    method: DELETE
    path: /Library/VirtualFolders
    params:
      name: OptionsProbe
    headers:
      Accept: application/json
    auth_role: admin
    expect:
      status: 204
    normalizers: *write
    operation_id: RemoveVirtualFolder
