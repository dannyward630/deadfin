    expect:
      status: 204
  - name: legacy progress with unrelated user prefix
    method: POST
    path: /Users/00000000-0000-0000-0000-000000000222/PlayingItems/7e897749137a8161f7a084cfad246bd3/Progress
    params:
      audioStreamIndex: 0
      canSeek: true
      isMuted: false
      isPaused: false
      liveStreamId: ""
      mediaSourceId: 7e897749137a8161f7a084cfad246bd3
      playMethod: DirectPlay
      playSessionId: 00000000-0000-0000-0000-000000000111
      positionTicks: 100000
      repeatMode: RepeatNone
      subtitleStreamIndex: -1
      volumeLevel: 100
    auth_role: admin
    normalizers:
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-language-header
    operation_id: SHADOW:OnPlaybackProgressLegacy
