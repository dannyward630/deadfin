format: goldenrec-scenario/v1
name: public discovery and users
base_url_env: JELLYFIN_BASE_URL
steps:
  - name: public system information Pascal response
    method: GET
    path: /System/Info/Public
    headers:
      Accept: application/json
    normalizers:
      - server-id
      - server-environment-fields
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-length-header
      - content-language-header
      - vary-header
    operation_id: GetPublicSystemInfo
  - name: public system information CamelCase response
    method: GET
    path: /System/Info/Public
    headers:
      Accept: application/json; profile="CamelCase"
    normalizers:
      - server-id
      - server-environment-fields
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-length-header
      - content-language-header
      - vary-header
    operation_id: GetPublicSystemInfo
