format: goldenrec-scenario/v1
name: static direct video stream HTTP contract
base_url_env: JELLYFIN_BASE_URL
steps:
  - name: static stream full GET
    method: GET
    path: /Videos/7e897749137a8161f7a084cfad246bd3/stream
    auth_role: fixture
    params:
      Static: true
      MediaSourceId: 7e897749137a8161f7a084cfad246bd3
    normalizers:
      - json-key-order
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-language-header
    operation_id: GetVideoStream
    expect:
      status: 200
  - name: static stream full HEAD by container
    method: HEAD
    path: /Videos/7e897749137a8161f7a084cfad246bd3/stream.mkv
    auth_role: fixture
    params:
      Static: true
      MediaSourceId: 7e897749137a8161f7a084cfad246bd3
    normalizers:
      - json-key-order
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-language-header
    operation_id: HeadVideoStreamByContainer
    expect:
      status: 200
  - name: static stream prefix range
    method: GET
    path: /Videos/7e897749137a8161f7a084cfad246bd3/stream
    auth_role: fixture
    params:
      Static: true
      MediaSourceId: 7e897749137a8161f7a084cfad246bd3
    headers:
      Range: bytes=0-9
    normalizers:
      - json-key-order
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-language-header
    operation_id: GetVideoStream
    expect:
      status: 206
  - name: static stream suffix range by container
    method: GET
    path: /Videos/7e897749137a8161f7a084cfad246bd3/stream.mkv
    auth_role: fixture
    params:
      Static: true
      MediaSourceId: 7e897749137a8161f7a084cfad246bd3
    headers:
      Range: bytes=-10
    normalizers:
      - json-key-order
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-language-header
    operation_id: GetVideoStreamByContainer
    expect:
      status: 206
  - name: static stream malformed range
    method: GET
    path: /Videos/7e897749137a8161f7a084cfad246bd3/stream
    auth_role: fixture
    params:
      Static: true
      MediaSourceId: 7e897749137a8161f7a084cfad246bd3
    headers:
      Range: bytes=not-a-range
    normalizers:
      - json-key-order
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-language-header
    operation_id: GetVideoStream
    expect:
      status: 200
  - name: static stream unsatisfiable range by container
    method: GET
    path: /Videos/7e897749137a8161f7a084cfad246bd3/stream.mkv
    auth_role: fixture
    params:
      Static: true
      MediaSourceId: 7e897749137a8161f7a084cfad246bd3
    headers:
      Range: bytes=999999999-
    normalizers:
      - json-key-order
      - response-time-headers
      - response-time-ms-header
      - process-time-headers
      - date-header
      - server-stack-header
      - content-language-header
    operation_id: GetVideoStreamByContainer
    expect:
      status: 416
