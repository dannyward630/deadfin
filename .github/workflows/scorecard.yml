# OpenSSF Scorecard for the public repository.
#
# Runs on each push to master and once a week. The results go to the
# repository's code scanning alerts and to the public Scorecard API
# (publish_results), which serves the Scorecard badge. With publish_results,
# Scorecard accepts only approved actions in this job, no run steps, and no
# top-level env, defaults or write permissions.
name: scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # security-events: write uploads the SARIF. id-token: write signs the
    # published results.
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # ossf/scorecard-action v2.4.4
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      # github/codeql-action/upload-sarif v4.38.2
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: results.sarif
