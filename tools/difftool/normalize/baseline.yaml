version: difftool-normalize/v1
rules:
  - name: server-id
    action: server_id
    reason: Each seeded server instance generates its own server identity; identity is not behavior under comparison.
  - name: server-environment-fields
    action: environment_fields
    reason: LocalAddress, ServerName, and configured server filesystem paths identify the configured host instance rather than HTTP behavior under comparison.
  - name: item-id-map
    action: item_ids
    reason: Identically seeded libraries use server-local item IDs; compare their stable kind/path identities instead.
  - name: entity-tags
    action: entity_tags
    reason: Entity tags and image tags are derived cache validators and vary with server-local IDs.
  - name: item-created-dates
    action: item_created_dates
    reason: Item DateCreated values are generated by each library scan; retain field presence and type while comparing durable item semantics.
  - name: user-data-keys
    action: user_data_keys
    reason: UserData.Key is the independently generated persisted row identity for a user and item on each host; only that structural field is normalized while ItemId and playback state remain compared.
  - name: item-user-data-playback-timestamps
    action: item_user_data_playback_timestamps
    explicit_only: true
    reason: Sequential stock and Deadfin playstate writes persist host-clock LastPlayedDate independently; pinned Jellyfin b04614e18d2aeed8d3d3de920c381c6bd5b97bdb Emby.Server.Implementations/Session/SessionManager.cs:841-854 and Emby.Server.Implementations/Library/UserDataManager.cs:50-93,420-435 show the write, persistence, and DTO projection. Only valid string LastPlayedDate fields in recognized item DTO UserData are normalized; sibling playback state and unrelated timestamps remain compared.
  - name: user-view-ids
    action: user_view_ids
    explicit_only: true
    reason: UserViews and GroupingOptions expose independently allocated library-view identities; only their explicitly selected root view identities are compared by stable Name and CollectionType semantics.
  - name: auth-tokens
    action: auth_tokens
    explicit_only: true
    reason: Authentication access tokens are independently minted opaque credentials and are compared only after explicit root-field redaction.
  - name: startup-user-name
    action: startup_user_name
    explicit_only: true
    reason: Initial startup usernames derive from each host environment; only the selected root StartupUser DTO Name string is normalized.
  - name: full-system-runtime-capabilities
    action: full_system_runtime_capabilities
    explicit_only: true
    reason: Full system information exposes host-runtime restart, update, library-monitor, and architecture capabilities; only the selected response root excludes these environment-specific fields.
  - name: response-time-headers
    action: drop_header
    header: X-Response-Time
    reason: Response timing is environmental, not API behavior.
  - name: response-time-ms-header
    action: drop_header
    header: X-Response-Time-Ms
    reason: Response timing is environmental, not API behavior.
  - name: process-time-headers
    action: drop_header
    header: X-Process-Time
    reason: Response timing is environmental, not API behavior.
  - name: date-header
    action: drop_header
    header: Date
    reason: HTTP response dates are transport timestamps, not API behavior.
  - name: server-stack-header
    action: drop_header
    header: Server
    reason: The Server header identifies the HTTP server stack (Kestrel versus Go net/http), not Jellyfin API behavior.
  - name: content-language-header
    action: drop_header
    header: Content-Language
    reason: Content-Language reflects host default-culture configuration rather than the replayed API contract.
  - name: vary-header
    action: drop_header
    header: Vary
    reason: Vary is incidental to each host's HTTP compression stack and is not endpoint response semantics.
  - name: content-length-header
    action: drop_header
    header: Content-Length
    reason: Content-Length is derived from server-local values that are normalized before structural comparison.
  - name: etag-header
    action: drop_header
    header: ETag
    reason: ETags are cache validators derived from server-local metadata and IDs.
  - name: scan-date-jitter
    action: date_jitter
    seconds: 120
    reason: Library scans can complete at different instants; timestamps within the bounded scan jitter window are equivalent.
  - name: json-key-order
    action: sort_json_keys
    reason: JSON object member order has no semantic meaning.
  - name: playlist-play-session
    action: playlist_replace
    pattern: '(?i)(PlaySessionId=)[^&[:space:]]+'
    replacement: '${1}<play-session-id>'
    reason: Play session IDs are request-local and do not affect playlist structure.
  - name: play-session-ids
    action: play_session_ids
    reason: Playback responses mint request-local play-session IDs; they do not change source selection or response structure.
  - name: transcoding-url-tokens
    action: transcoding_url_tokens
    reason: Stock PlaybackInfo TranscodingUrl responses carry host-local item IDs in the /Videos UUID path and MediaSourceId query value, a host-local media-source ETag in nonempty Tag, and an opaque per-server ApiKey; only those values are normalized while exact URL parameter order and all other values remain compared.
  - name: subtitle-delivery-url-item-ids
    action: transcoding_url_tokens
    explicit_only: true
    reason: Subtitle PlaybackInfo DeliveryUrl fields encode host-local item and media-source UUIDs in their two /Videos path components plus an ApiKey token; only that rooted subtitle-stream URL shape and token are normalized while its origin, remaining path, query order, and unrelated values remain compared.
  - name: login-session-volatiles
    action: login_session_volatiles
    reason: Authenticated user and session DTOs mint per-server identities, activity timestamps, and request-source endpoints; only their explicitly recognized response positions are normalized.
  - name: library-folder-ids
    action: library_folder_ids
    explicit_only: true
    reason: Virtual folder ItemId values are server-local CollectionFolder identities derived from each host's library root path; only a string ItemId field in the VirtualFolders response array is replaced with a stable token while a non-string ItemId (wrong type), array order, Name, CollectionType, Locations, and RefreshStatus remain compared.
  - name: library-options-defaults
    action: library_options_defaults
    explicit_only: true
    reason: Default LibraryOptions values are populated by each server's compatibility defaults and are not part of the management-route contract; only a JSON-object LibraryOptions field in the VirtualFolders response is replaced with a stable token while a non-object LibraryOptions (wrong type), CollectionType, Name, ItemId, and RefreshStatus remain compared. The corpus scopes this action to default-options readback only; the persisted-options readback omits it so changed EnableInternetProviders and SaveLocalMetadata values stay visible in the normalized comparison.
  - name: library-options-persisted
    action: library_options_persisted
    explicit_only: true
    reason: Persisted-options readback masks host-local default LibraryOptions fields while preserving the explicitly persisted option values; each default field in a JSON-object LibraryOptions is replaced with a stable token while EnableInternetProviders and SaveLocalMetadata keep their actual values so a host that does not persist the same values is caught. A non-object LibraryOptions (wrong type) is left intact. This is the persisted-options readback counterpart to library-options-defaults.
  - name: quickconnect-volatiles
    action: quickconnect_volatiles
    explicit_only: true
    reason: A pending QuickConnect result contains host-local values in Secret, Code, and DateAdded. This rule normalizes only correctly typed root fields. It preserves metadata, field presence, wrong types, nested fields, error bodies, and authentication results.
  - name: problem-details-trace
    action: problem_details_trace
    explicit_only: true
    reason: ASP.NET ProblemDetails traceId is a W3C traceparent generated per request and differs on every call. This rule replaces only the root traceId field. It preserves type, title, status, and the errors map.
