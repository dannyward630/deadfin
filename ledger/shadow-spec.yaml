# Shadow spec — routes served but hidden from OpenAPI.
#
# Each row maps a Deadfin route to its upstream controller source and the
# client set that uses it. Operation IDs match Deadfin's route metadata
# exactly. Routes with the SHADOW: prefix are hidden routes. Routes without
# the prefix are non-REST conveniences (for example, the /socket WebSocket
# transport) that Swiftfin uses but that do not appear as Paths.* operations.
#
# Clients: swiftfin, web, or both.

operations:
  - id: SHADOW:AuthenticateUser
    method: POST
    path: /Users/{userId}/Authenticate
    subsystem: User
    upstream: UserController.cs:178
    clients: [swiftfin, web]
    swiftfin: false

  - id: SHADOW:DeleteItemUserData
    method: DELETE
    path: /UserItems/{itemId}/UserData
    subsystem: Items
    upstream: ItemsController.cs:1128 (Deadfin extension; upstream has GET/POST only)
